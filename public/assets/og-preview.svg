<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .title { font-family: 'Fredoka', cursive, sans-serif; font-weight: 700; fill: #1E1E24; font-size: 76px; }
      .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #636E72; font-size: 34px; }
      .pill-text { font-family: 'Fredoka', cursive, sans-serif; font-weight: 600; fill: #1E1E24; font-size: 26px; }
      .card-title { font-family: 'Fredoka', cursive, sans-serif; font-weight: 700; fill: #1E1E24; font-size: 32px; }
      .card-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #2D3436; font-size: 19px; }
    </style>
    <!-- Pattern -->
    <pattern id="dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.5" fill="#E2DDD5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Top Badge -->
  <g transform="translate(425, 70)">
    <rect width="350" height="54" rx="27" fill="#FFEAA7" stroke="#1E1E24" stroke-width="3.5"/>
    <text x="175" y="36" text-anchor="middle" class="pill-text">⚡ SEMESTER SURVIVAL KIT</text>
  </g>

  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" class="title">📚 THE STUDY VAULT</text>
  <text x="600" y="250" text-anchor="middle" class="tagline">"Because apparently we have to study."</text>

  <!-- 5 Cards Preview -->
  <!-- Card 1: AIML -->
  <g transform="translate(70, 310)">
    <rect width="190" height="230" rx="22" fill="#EAE4FF" stroke="#1E1E24" stroke-width="3.5"/>
    <rect x="0" y="0" width="190" height="12" rx="6" fill="#7C5CFC"/>
    <text x="95" y="70" text-anchor="middle" font-size="52">🤖</text>
    <text x="95" y="125" text-anchor="middle" class="card-title">AIML</text>
    <text x="95" y="165" text-anchor="middle" class="card-sub">Let's pretend</text>
    <text x="95" y="190" text-anchor="middle" class="card-sub">we prepared</text>
  </g>

  <!-- Card 2: GAI -->
  <g transform="translate(290, 310)">
    <rect width="190" height="230" rx="22" fill="#FFE5E5" stroke="#1E1E24" stroke-width="3.5"/>
    <rect x="0" y="0" width="190" height="12" rx="6" fill="#FF6B6B"/>
    <text x="95" y="70" text-anchor="middle" font-size="52">✨</text>
    <text x="95" y="125" text-anchor="middle" class="card-title">GAI</text>
    <text x="95" y="165" text-anchor="middle" class="card-sub">Prompting our</text>
    <text x="95" y="190" text-anchor="middle" class="card-sub">way through</text>
  </g>

  <!-- Card 3: QCAI -->
  <g transform="translate(510, 310)">
    <rect width="190" height="230" rx="22" fill="#DBF7EF" stroke="#1E1E24" stroke-width="3.5"/>
    <rect x="0" y="0" width="190" height="12" rx="6" fill="#00B894"/>
    <text x="95" y="70" text-anchor="middle" font-size="52">🧠</text>
    <text x="95" y="125" text-anchor="middle" class="card-title">QCAI</text>
    <text x="95" y="165" text-anchor="middle" class="card-sub">Superposition</text>
    <text x="95" y="190" text-anchor="middle" class="card-sub">of passing</text>
  </g>

  <!-- Card 4: CV -->
  <g transform="translate(730, 310)">
    <rect width="190" height="230" rx="22" fill="#FFE8F1" stroke="#1E1E24" stroke-width="3.5"/>
    <rect x="0" y="0" width="190" height="12" rx="6" fill="#FD79A8"/>
    <text x="95" y="70" text-anchor="middle" font-size="52">👁️</text>
    <text x="95" y="125" text-anchor="middle" class="card-title">CV</text>
    <text x="95" y="165" text-anchor="middle" class="card-sub">Dropping GPA</text>
    <text x="95" y="190" text-anchor="middle" class="card-sub">in 4K UHD</text>
  </g>

  <!-- Card 5: APS -->
  <g transform="translate(950, 310)">
    <rect width="190" height="230" rx="22" fill="#FFF3D6" stroke="#1E1E24" stroke-width="3.5"/>
    <rect x="0" y="0" width="190" height="12" rx="6" fill="#FFA502"/>
    <text x="95" y="70" text-anchor="middle" font-size="52">📊</text>
    <text x="95" y="125" text-anchor="middle" class="card-title">APS</text>
    <text x="95" y="165" text-anchor="middle" class="card-sub">Probability &gt; 0</text>
    <text x="95" y="190" text-anchor="middle" class="card-sub">maybe.</text>
  </g>

  <!-- Floating playful doodles -->
  <path d="M120 140L125 155L140 160L125 165L120 180L115 165L100 160L115 155Z" fill="#FFA502"/>
  <path d="M1060 180L1065 195L1080 200L1065 205L1060 220L1055 205L1040 200L1055 195Z" fill="#7C5CFC"/>
  <circle cx="200" cy="180" r="6" fill="#FF7675"/>
  <circle cx="980" cy="120" r="8" fill="#00B894"/>

  <!-- Footer Tag -->
  <text x="600" y="590" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#A4B0BE">
    5 SUBJECTS • 0 EXCUSES • 100% DIRECT DOWNLOADS
  </text>
</svg>
